name: One-time bootstrap flock-map restricted key (REMOVE AFTER)

# TEMPORARY: authorizes the flock-map repo's RESTRICTED forced-command deploy
# key. This is NOT an unrestricted key — the key can only run
# /usr/local/bin/flock-map-deploy (whitelist-validating dispatcher) with no
# shell/pty/forwarding, plus one fixed sudoers rule. Reuses torii-continuum's
# proven host-key-verified broad-sudo path for this one-time setup only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pinned bootstrap script from flock-map repo
        uses: actions/checkout@v4
        with:
          repository: ChiefmonkeyArt/flock-map
          ref: main
          persist-credentials: false

      - name: Install SSH key (host-key verified)
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          VPS_DEPLOY_HOST_KEY: ${{ secrets.VPS_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_HOST:-}" ]]; then
            echo "::error::VPS_DEPLOY_SSH_KEY or VPS_DEPLOY_HOST secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519_bootstrap
          chmod 600 ~/.ssh/id_ed25519_bootstrap
          host_only="${SSH_HOST#*@}"
          scan="$(mktemp)"
          ssh-keyscan -T 10 -t ed25519 "$host_only" > "$scan" 2>/dev/null || true
          live_fp="$(ssh-keygen -lf "$scan" -E sha256 2>/dev/null | awk 'NF>=2 {print $2}' | head -n1)"
          rm -f "$scan"
          expected_fp="${VPS_DEPLOY_HOST_KEY}"
          [[ "$expected_fp" == SHA256:* ]] || expected_fp="SHA256:${expected_fp}"
          if [[ -z "$live_fp" || "$live_fp" != "$expected_fp" ]]; then
            echo "::error::VPS host key mismatch: expected $expected_fp, got ${live_fp:-<none>}"
            exit 1
          fi
          ssh-keyscan -T 10 -t ed25519 "$host_only" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Run restricted-key bootstrap (idempotent)
        env:
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          PUB_BLOB="AAAAC3NzaC1lZDI1NTE5AAAAIJWcNv7PQ3NMYdIhcIOKkUtn7hxEsiNi9tY3K7ijsyF1"
          ssh -i ~/.ssh/id_ed25519_bootstrap -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_HOST" sudo -n bash -s -- "$PUB_BLOB" < ops/bootstrap-vps.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519_bootstrap ~/.ssh/known_hosts

name: Install Hermes Dashboard wiring

# Installs the owner-brain Hermes Web Dashboard as a standalone subdomain vhost,
# gated by Hermes's OWN password auth (basic_auth). This replaces the earlier
# same-origin /hermes/ path mount, which is impossible to proxy cleanly: Hermes's
# SPA uses root-relative form actions and asset URLs that ignore
# X-Forwarded-Prefix. See docs/hermes-dashboard-auth.md for the decision.
#
# What it puts on the VPS:
#   - dashboard.basic_auth.{username,password} + dashboard.public_url (via `hermes config set`)
#   - HERMES_DASHBOARD_BASIC_AUTH_SECRET in Hermes's .env (stable sessions)
#   - /etc/systemd/system/torii-hermes-dashboard.service (loopback 127.0.0.1:9119)
#   - /etc/nginx/sites-available/<hostname>.conf + symlink (reverse proxy)
#   - a Let's Encrypt cert for <hostname>
#
# ROBUSTNESS GUARANTEES:
#   - idempotent: re-running skips already-configured auth, reuses the secret, and
#     re-installs the same files. It does not rotate credentials.
#   - config via `hermes config set` (dot-notation keys) + `hermes config path`/`env-path`,
#     NOT hand-edited YAML, so it survives Hermes renaming its config file layout.
#   - verify-then-proceed: nginx -t is guarded and reverted on failure; the unit
#     must reach active before the vhost is wired; DNS must resolve before certbot.
#   - the generated login password is written to 0600 at ~/.hermes/dashboard-password
#     (never echoed to logs). Read it from there to sign in.
#
# PREREQUISITE THE WORKFLOW CANNOT DO FOR YOU: a DNS record for <hostname>. Add
#   <hostname>  A  <VPS-IP>
# at your registrar first; the install fails with a clear message if it doesn't resolve.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Repo ref to source the wiring files from (tag, e.g. v0.2.136-alpha)'
        required: true
        default: 'v0.2.136-alpha'
        type: string
      hostname:
        description: 'Dashboard subdomain FQDN'
        required: true
        default: 'hermes.chiefmonkey.art'
        type: string
      username:
        description: 'Dashboard login username'
        required: false
        default: 'hermes'
        type: string
      disable:
        description: 'Set true to stop the dashboard, remove the vhost, and disable the unit (rollback)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wiring files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            ops/nginx/hermes.conf
            ops/systemd/torii-hermes-dashboard.service

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_HOST:-}" ]]; then
            echo "::error::VPS_DEPLOY_SSH_KEY or VPS_DEPLOY_HOST secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519_torii
          chmod 600 ~/.ssh/id_ed25519_torii
          host_only="${SSH_HOST#*@}"
          ssh-keyscan -T 10 -t ed25519 "$host_only" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Install wiring on VPS
        env:
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          SSH_OPTS: -i ~/.ssh/id_ed25519_torii -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15
        run: |
          set -euo pipefail
          HOST='${{ inputs.hostname }}'
          USERNAME='${{ inputs.username }}'
          scp $SSH_OPTS ops/nginx/hermes.conf ops/systemd/torii-hermes-dashboard.service "$SSH_HOST:/tmp/"

          # ── Rollback / cleanup mode ────────────────────────────────────────
          if [[ "${{ inputs.disable }}" == "true" ]]; then
            ssh $SSH_OPTS "$SSH_HOST" "set -euo pipefail
              sudo systemctl disable --now torii-hermes-dashboard.service 2>/dev/null || true
              sudo systemctl reset-failed torii-hermes-dashboard.service 2>/dev/null || true
              sudo rm -f '/etc/nginx/sites-enabled/${HOST}.conf'
              sudo rm -f '/etc/nginx/sites-available/${HOST}.conf'
              sudo nginx -t && sudo systemctl reload nginx
              echo 'dashboard unit stopped + vhost removed (config/auth/cert left in place)'
            "
            exit 0
          fi

          ssh $SSH_OPTS "$SSH_HOST" bash -s "$HOST" "$USERNAME" <<'REMOTE'
          set -euo pipefail
          HOST="$1"
          USERNAME="$2"

          # ── 0. Resolve hermes paths + binary (robust: no hardcoded layout) ──
          HBIN=$(sudo -u hermes-owner bash -lc 'command -v hermes' || true)
          if [[ -z "$HBIN" ]]; then
            echo "::error::hermes binary not found for hermes-owner; install the owner brain first"
            exit 1
          fi
          HCONF=$(sudo -u hermes-owner bash -lc 'hermes config path' | tail -1)
          HENV=$(sudo -u hermes-owner bash -lc 'hermes config env-path' | tail -1)
          echo "hermes binary:      $HBIN"
          echo "hermes config.yaml: $HCONF"
          echo "hermes .env:        $HENV"

          get_cfg() { sudo -u hermes-owner bash -lc "hermes config get '$1'" 2>/dev/null | tail -1 | tr -d '[:space:]'; }

          # ── 1. Configure basic_auth (idempotent — never rotate) ────────────
          CUR_USER=$(get_cfg dashboard.basic_auth.username)
          if [[ -n "$CUR_USER" ]]; then
            echo "basic_auth already configured (username=$CUR_USER); skipping credential setup"
          else
            PW=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
            # Persist the plaintext for the operator (0600; never echoed to logs).
            umask 077
            printf '%s\n' "$PW" | sudo -u hermes-owner tee "/home/hermes-owner/.hermes/dashboard-password" >/dev/null
            sudo -u hermes-owner chmod 600 "/home/hermes-owner/.hermes/dashboard-password"
            sudo -u hermes-owner bash -lc "hermes config set dashboard.basic_auth.username \"$USERNAME\""
            sudo -u hermes-owner bash -lc "hermes config set dashboard.basic_auth.password \"$PW\""
            echo "generated dashboard credentials; password saved to ~/.hermes/dashboard-password (0600)"
          fi

          # ── 2. public_url (non-loopback → engages Hermes's own auth) ───────
          sudo -u hermes-owner bash -lc "hermes config set dashboard.public_url \"https://$HOST\""
          echo "dashboard.public_url = https://$HOST"

          # ── 3. Stable auth signing secret (idempotent) ─────────────────────
          if ! sudo -u hermes-owner grep -q '^HERMES_DASHBOARD_BASIC_AUTH_SECRET=' "$HENV" 2>/dev/null; then
            SECRET=$(openssl rand -base64 32 | tr -d '\n')
            printf 'HERMES_DASHBOARD_BASIC_AUTH_SECRET=%s\n' "$SECRET" | sudo -u hermes-owner tee -a "$HENV" >/dev/null
            echo "wrote HERMES_DASHBOARD_BASIC_AUTH_SECRET to $HENV"
          else
            echo "auth secret already present; reusing"
          fi

          # ── 4. systemd unit (loopback bind is the security boundary) ──────
          sudo sed "s#__HERMES_BIN__#$HBIN#" /tmp/torii-hermes-dashboard.service \
            | sudo tee /etc/systemd/system/torii-hermes-dashboard.service >/dev/null
          sudo chmod 0644 /etc/systemd/system/torii-hermes-dashboard.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now torii-hermes-dashboard.service
          sleep 3
          if ! systemctl is-active --quiet torii-hermes-dashboard.service; then
            echo "::error::torii-hermes-dashboard.service failed to start"
            sudo journalctl -u torii-hermes-dashboard.service --no-pager -n 40 || true
            exit 1
          fi
          echo "dashboard unit active (loopback 127.0.0.1:9119)"

          # ── 5. DNS must resolve before certbot (clear error, not a hang) ────
          IP=$( (dig +short +time=5 +tries=2 "$HOST" @1.1.1.1 2>/dev/null || getent ahostsv4 "$HOST" 2>/dev/null | awk '{print $1}') | head -1 )
          if [[ -z "$IP" ]]; then
            echo "::error::$HOST does not resolve. Add a DNS A record '$HOST' -> this VPS's public IP, wait for propagation, then re-run."
            exit 1
          fi
          echo "$HOST resolves to $IP"

          # ── 6. Cert (if absent) → full vhost ──────────────────────────────
          sudo mkdir -p /var/www/certbot
          if sudo test -f "/etc/letsencrypt/live/${HOST}/fullchain.pem"; then
            echo "cert already present for $HOST (skipping challenge vhost + issuance)"
          else
            # Fresh box: install a minimal port-80 vhost FIRST so Let's Encrypt
            # can reach the ACME challenge before the 443 cert exists (nginx can't
            # load a vhost that references a not-yet-issued ssl_certificate).
            {
              printf 'server {\n'
              printf '    listen 80;\n'
              printf '    listen [::]:80;\n'
              printf '    server_name %s;\n' "$HOST"
              printf '    location /.well-known/acme-challenge/ { root /var/www/certbot; }\n'
              printf '    location / { return 301 https://$host$request_uri; }\n'
              printf '}\n'
            } | sudo tee "/etc/nginx/sites-available/${HOST}.conf" >/dev/null
            sudo ln -sf "/etc/nginx/sites-available/${HOST}.conf" "/etc/nginx/sites-enabled/${HOST}.conf"
            sudo nginx -t && sudo systemctl reload nginx
            sudo certbot certonly --webroot -w /var/www/certbot -d "$HOST" \
              --non-interactive --agree-tos --keep-until-expiring
            sudo test -f "/etc/letsencrypt/live/${HOST}/fullchain.pem" || { echo "::error::cert issuance failed"; exit 1; }
          fi

          # Now the full production vhost (HTTP redirect + HTTPS reverse proxy).
          sudo sed "s/__HERMES_DASHBOARD_HOST__/$HOST/g" /tmp/hermes.conf \
            | sudo tee "/etc/nginx/sites-available/${HOST}.conf" >/dev/null
          if ! sudo nginx -t 2>&1; then
            echo "::error::nginx -t failed with the production vhost"
            exit 1
          fi
          sudo systemctl reload nginx
          echo "nginx vhost live: ${HOST}"

          # ── 7. Verify ───────────────────────────────────────────────────────
          LP=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:9119/ || true)
          HT=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://${HOST}/" || true)
          echo "loopback (no auth) -> HTTP $LP (expect 302 -> /login: auth engaged)"
          echo "https://${HOST}/   -> HTTP $HT (expect 302/200: reaching the login)"
          case "$LP" in
            302|301) echo "dashboard auth gate active";;
            *) echo "::warning::unexpected loopback status $LP; check the unit";;
          esac
          echo "DONE. Sign in at https://${HOST}/ with username '$USERNAME' and the password in ~/.hermes/dashboard-password"
          REMOTE

          echo "---- note ----"
          echo "Login password was written to /home/hermes-owner/.hermes/dashboard-password (0600) if this was the first run; read it with:"
          echo "  sudo cat /home/hermes-owner/.hermes/dashboard-password"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519_torii ~/.ssh/known_hosts
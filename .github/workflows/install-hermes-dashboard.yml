name: Install Hermes Dashboard wiring

# Installs the owner-brain Hermes Web Dashboard as a passwordless loopback
# backend, mounted at /hermes/ on the Continuum apex and gated by the operator's
# existing Continuum Nostr session. This replaces the subdomain + basic_auth
# design (HERMES-DASHBOARD-2), which was withdrawn. See
# docs/hermes-dashboard-auth.md for the decision and the validated spike.
#
# What it puts on the VPS:
#   - un-keys dashboard.public_url + dashboard.basic_auth (passwordless loopback)
#   - HERMES_DASHBOARD_SESSION_TOKEN (hex) in Hermes's .env (stable WS token)
#   - /etc/systemd/system/torii-hermes-dashboard.service (loopback 127.0.0.1:9119)
#   - /opt/torii/nginx-fragments/hermes.conf (the /hermes/ gateway block)
#
# ROBUSTNESS GUARANTEES:
#   - idempotent: re-running re-installs the same files and reuses the pinned
#     session token. It never rotates it.
#   - no plaintext credential lands on disk (no password, no bootstrap file).
#   - config via `hermes config unset` + `hermes config path`/`env-path`, not
#     hand-edited YAML, so it survives Hermes renaming its config layout.
#
# NO PREREQUISITE for the user: no DNS A record, no password, no SSH. The user
# signs in to Continuum with their Nostr signer; Hermes opens at /hermes/ behind
# that session.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Repo ref to source the wiring files from (tag, e.g. v0.2.137-alpha)'
        required: true
        default: 'v0.2.137-alpha'
        type: string
      disable:
        description: 'Set true to stop the dashboard, remove the fragment, and disable the unit (rollback)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wiring files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            ops/nginx/hermes.conf
            ops/systemd/torii-hermes-dashboard.service

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_HOST:-}" ]]; then
            echo "::error::VPS_DEPLOY_SSH_KEY or VPS_DEPLOY_HOST secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519_torii
          chmod 600 ~/.ssh/id_ed25519_torii
          host_only="${SSH_HOST#*@}"
          ssh-keyscan -T 10 -t ed25519 "$host_only" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Install wiring on VPS
        env:
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          SSH_OPTS: -i ~/.ssh/id_ed25519_torii -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15
        run: |
          set -euo pipefail
          scp $SSH_OPTS ops/nginx/hermes.conf ops/systemd/torii-hermes-dashboard.service "$SSH_HOST:/tmp/"

          # ── Rollback / cleanup mode ────────────────────────────────────────
          if [[ "${{ inputs.disable }}" == "true" ]]; then
            ssh $SSH_OPTS "$SSH_HOST" "set -euo pipefail
              sudo systemctl disable --now torii-hermes-dashboard.service 2>/dev/null || true
              sudo systemctl reset-failed torii-hermes-dashboard.service 2>/dev/null || true
              sudo rm -f /opt/torii/nginx-fragments/hermes.conf
              sudo nginx -t && sudo systemctl reload nginx
              echo 'dashboard unit stopped + /hermes/ fragment removed (config + token left in place)'
            "
            exit 0
          fi

          ssh $SSH_OPTS "$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail

          # ── 0. Resolve hermes paths + binary (robust: no hardcoded layout) ──
          HBIN=$(sudo -u hermes-owner bash -lc 'command -v hermes' || true)
          if [[ -z "$HBIN" ]]; then
            echo "::error::hermes binary not found for hermes-owner; install the owner brain first"
            exit 1
          fi
          HENV=$(sudo -u hermes-owner bash -lc 'hermes config env-path' | tail -1)
          echo "hermes binary: $HBIN"
          echo "hermes .env:   $HENV"

          # ── 1. Restore passwordless loopback (idempotent un-keys) ──────────
          # Dropping public_url + basic_auth puts Hermes in unauthenticated
          # loopback mode: no login, no password. The Nostr session gate in
          # nginx is the sole authority.
          sudo -u hermes-owner bash -lc 'hermes config unset dashboard.public_url' 2>/dev/null || true
          sudo -u hermes-owner bash -lc 'hermes config unset dashboard.basic_auth' 2>/dev/null || true
          echo "dashboard.public_url + basic_auth unset (passwordless loopback)"

          # ── 2. Stable session token (hex — MUST be URL-safe) ───────────────
          # A base64 token containing '+' breaks the ?token= WS comparison
          # (the query string decodes '+' to a space). Hex is safe.
          if ! sudo -u hermes-owner grep -q '^HERMES_DASHBOARD_SESSION_TOKEN=' "$HENV" 2>/dev/null; then
            TOK=$(openssl rand -hex 32)
            printf 'HERMES_DASHBOARD_SESSION_TOKEN=%s\n' "$TOK" | sudo -u hermes-owner tee -a "$HENV" >/dev/null
            echo "pinned HERMES_DASHBOARD_SESSION_TOKEN (hex) to $HENV"
          else
            echo "session token already present; reusing"
          fi

          # ── 3. systemd unit (loopback bind is the security boundary) ──────
          sudo sed "s#__HERMES_BIN__#$HBIN#" /tmp/torii-hermes-dashboard.service \
            | sudo tee /etc/systemd/system/torii-hermes-dashboard.service >/dev/null
          sudo chmod 0644 /etc/systemd/system/torii-hermes-dashboard.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now torii-hermes-dashboard.service
          sleep 3
          if ! systemctl is-active --quiet torii-hermes-dashboard.service; then
            echo "::error::torii-hermes-dashboard.service failed to start"
            sudo journalctl -u torii-hermes-dashboard.service --no-pager -n 40 || true
            exit 1
          fi
          echo "dashboard unit active (loopback 127.0.0.1:9119)"

          # ── 4. Install the /hermes/ gateway fragment (same origin) ─────────
          sudo cp /tmp/hermes.conf /opt/torii/nginx-fragments/hermes.conf
          sudo chown torii:torii /opt/torii/nginx-fragments/hermes.conf
          sudo chmod 0644 /opt/torii/nginx-fragments/hermes.conf
          if ! sudo nginx -t 2>&1; then
            echo "::error::nginx -t failed with the /hermes/ fragment"
            exit 1
          fi
          sudo systemctl reload nginx
          echo "nginx /hermes/ fragment live"

          # ── 5. Verify ───────────────────────────────────────────────────────
          LP=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:9119/ || true)
          echo "loopback (no auth) -> HTTP $LP (expect 200: passwordless)"
          case "$LP" in
            200) echo "passwordless loopback confirmed";;
            *)   echo "::warning::unexpected loopback status $LP; expected 200 (no public_url/basic_auth)";;
          esac
          echo "DONE. Hermes is gated behind the Continuum Nostr session at /hermes/."
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519_torii ~/.ssh/known_hosts
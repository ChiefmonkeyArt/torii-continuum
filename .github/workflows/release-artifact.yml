name: Release artifact

# OPS-ARTIFACT-1 (v0.2.103-alpha) — builds and publishes the unattended-deploy
# release artifact for a pushed release tag. This is the ONLY place the SPA is
# built and the agent's production dependencies are installed for a shipped
# release; the VPS never repeats this work — it downloads the published
# artifact, verifies it, and promotes it (ops/deploy-unattended.sh, fast path).
#
# Trigger: an annotated tag matching v<semver>[-prerelease] pushed to the repo
# (the same grammar ops/deploy-unattended.sh and ops/lib/build-release-
# artifact.sh enforce). Runs on a clean checkout of exactly that tag — never a
# branch — so the artifact's provenance is unambiguous.
#
# Publishes three assets to a GitHub Release for the tag:
#   torii-continuum-<tag>.tar.gz            the artifact
#   torii-continuum-<tag>.tar.gz.sha256     its checksum (VPS verifies before
#                                            ever extracting the tarball)
#   torii-continuum-<tag>.manifest.json     non-secret build provenance

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build + publish release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Defence in depth (ci.yml already gates every push/PR): re-run both
      # suites here too before packaging, but on the SAME Node major each
      # already uses in ci.yml — NOT one shared version for both. The
      # frontend's jsdom-based tests rely on Node having no built-in
      # `navigator` global (true on Node 20; Node 22+ defines it as a
      # getter-only accessor, which a few pre-existing test helpers'
      # `globalThis.navigator = ...` assignment throws against). The agent
      # requires >=22.4.0. Mixing both under one Node version breaks one or
      # the other — so this job switches Node version between the two.
      - name: Frontend deps + tests (Node 20 — matches ci.yml's frontend job)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          set -euo pipefail
          npm ci
          npm test

      # Pinned to '22' (latest 22.x patch) rather than the exact floor
      # '22.4.0': that early patch predates stable unflagged require(esm),
      # which breaks jsdom's html-encoding-sniffer -> @exodus/bytes chain
      # (fixed upstream in Node 22.12+) — moot for the agent's own tests,
      # which don't use jsdom, but this Node also runs the builder script
      # below, so it must stay within the agent's >=22.4.0 engines floor.
      - name: Switch to Node 22 (agent's engines floor) for agent tests + the artifact build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Agent deps + tests (Node 22)
        run: |
          set -euo pipefail
          cd agent && npm ci && npm test

      - name: Build the release artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact-out
          bash ops/lib/build-release-artifact.sh "$PWD" "${{ steps.tag.outputs.tag }}" /tmp/artifact-out

      - name: Validate the built artifact (checksum, manifest, extraction, no-secrets)
        run: |
          set -euo pipefail
          ARTIFACT_DIR=/tmp/artifact-out ARTIFACT_TAG="${{ steps.tag.outputs.tag }}" \
            bash ops/test/release-artifact.test.sh

      - name: Publish GitHub Release with artifact assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: torii-continuum ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            /tmp/artifact-out/torii-continuum-${{ steps.tag.outputs.tag }}.tar.gz
            /tmp/artifact-out/torii-continuum-${{ steps.tag.outputs.tag }}.tar.gz.sha256
            /tmp/artifact-out/torii-continuum-${{ steps.tag.outputs.tag }}.manifest.json

      - name: Upload artifact as a workflow artifact too (debugging / air-gapped mirror)
        uses: actions/upload-artifact@v4
        with:
          name: torii-continuum-${{ steps.tag.outputs.tag }}
          path: |
            /tmp/artifact-out/torii-continuum-${{ steps.tag.outputs.tag }}.tar.gz
            /tmp/artifact-out/torii-continuum-${{ steps.tag.outputs.tag }}.tar.gz.sha256
            /tmp/artifact-out/torii-continuum-${{ steps.tag.outputs.tag }}.manifest.json
          retention-days: 90

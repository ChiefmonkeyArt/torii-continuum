name: Deploy to VPS

# Manual deploy of an already-released torii-continuum tag to the operator's
# VPS. Runs the torii-suite installer with TORII_CONTINUUM_REF=<tag>. The
# installer is idempotent: the same tag redeployed is a no-op, a newer tag
# rolls forward, an older tag rolls back.
#
# SECRETS (repo secrets, encrypted at rest, never printed by this workflow):
#   VPS_DEPLOY_SSH_KEY  ed25519 private key, matches ~ubuntu/.ssh/authorized_keys
#                       entry commented `torii-deploy-agent` on the VPS.
#   VPS_DEPLOY_HOST     `ubuntu@chiefmonkey.art` (host is a secret so the target
#                       is never hardcoded in the repo — rotating the operator
#                       or the box is a secret edit, not a code change).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (must exist as a GitHub release, e.g. v0.2.111-alpha)'
        required: true
        type: string

concurrency:
  # Never run two VPS deploys at once — the installer holds no external lock
  # and a concurrent run would race on /apps/continuum/{releases,current}.
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Mirror ops/deploy-unattended.sh CONTINUUM_TAG_RE exactly.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a valid vX.Y.Z[-pre] release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_ENV"

      - name: Confirm tag exists as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refuse to deploy a tag that has no release artifact — that either
          # means the release workflow is still running or the tag is a typo.
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release '$tag' not found on ${{ github.repository }}"
            exit 1
          fi

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_HOST:-}" ]]; then
            echo "::error::VPS_DEPLOY_SSH_KEY or VPS_DEPLOY_HOST secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Key material comes straight from the encrypted secret — never
          # printed. GitHub Actions auto-masks any exact secret value in logs
          # as a second line of defence.
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519_torii
          chmod 600 ~/.ssh/id_ed25519_torii
          # Pin the VPS host key from a live scan into known_hosts. Prevents
          # trust-on-first-use MITM without hardcoding a fingerprint we'd
          # have to bump when the box is rebuilt.
          host_only="${SSH_HOST#*@}"
          ssh-keyscan -T 10 -t ed25519 "$host_only" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tag on VPS
        env:
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          echo "Deploying $tag to $SSH_HOST via torii-suite installer..."
          # Run the installer with the requested tag. Env is sourced from the
          # operator's /opt/torii-suite/checkout/.env on the box (domain, admin
          # npub, ollama settings) so this workflow carries no operator data.
          ssh -i ~/.ssh/id_ed25519_torii -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -o ConnectTimeout=15 "$SSH_HOST" bash -s -- "$tag" <<'REMOTE'
          set -euo pipefail
          TAG="$1"
          cd /opt/torii-suite/checkout
          # Load operator env (domain, admin npub, ollama) exactly as bootstrap.sh does.
          set -a
          sudo -n bash -c '. /opt/torii-suite/checkout/.env && env' > /tmp/torii-env.$$
          # shellcheck disable=SC1090
          . /tmp/torii-env.$$
          rm -f /tmp/torii-env.$$
          set +a
          export SUITE_WORK_DIR="${SUITE_WORK_DIR:-/opt/torii-suite/work}"
          export APPS_ROOT="/apps"
          export TORII_CONTINUUM_REF="$TAG"
          sudo -n -E /opt/torii-suite/checkout/installers/install-continuum.sh
          REMOTE

      - name: Verify live version matches
        env:
          SSH_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          host_only="${SSH_HOST#*@}"
          # /api/health returns bare semver (no 'v' prefix); tag carries the v.
          expected="${tag#v}"
          # Retry briefly — nginx reload + agent restart can take a moment.
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS --max-time 10 "https://${host_only}/api/health" \
                   | python3 -c 'import json,sys;print(json.load(sys.stdin).get("version",""))')
            if [[ "$live" == "$expected" ]]; then
              echo "✓ live version $live matches deployed tag $tag"
              exit 0
            fi
            echo "attempt $attempt: live=$live expected=$expected — retrying..."
            sleep 5
          done
          echo "::error::live version '$live' does not match deployed tag '$tag'"
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519_torii ~/.ssh/known_hosts

# Torii Continuum Agent — same-origin API reverse proxy
#
# Installed to /etc/nginx/snippets/torii-api.conf by ops/install-agent.sh.
# INCLUDE THIS INSIDE A `server { ... }` BLOCK (the HTTPS server for your Torii
# gateway domain), NOT at http{} or top level:
#
#     server {
#         server_name torii.example;      # your gateway
#         # ... TLS, root, other locations ...
#         include snippets/torii-api.conf;
#     }
#
# It exposes the agent at the SAME ORIGIN as the Console under /api/, so the
# browser makes credentialed same-origin calls with no CORS round-trip. The
# agent listens on loopback only; nothing reaches it except through here.
#
# ── Rate limiting (defence in depth) ────────────────────────────────────────
# The agent already rate-limits the auth surface in-process (Fastify
# @fastify/rate-limit, since v0.2.14-alpha). The `limit_req` below is a second,
# cheaper layer that sheds a flood at the edge before it ever reaches Node.
#
# `limit_req` needs a zone declared in the http{} context — it CANNOT live in
# this server-scoped snippet. ops/install-agent.sh drops that zone into
# /etc/nginx/conf.d/torii-api-ratelimit.conf (auto-included by the stock
# http{} block on Debian/Ubuntu). Its contents, for reference:
#
#     # /etc/nginx/conf.d/torii-api-ratelimit.conf  (http context)
#     limit_req_zone $binary_remote_addr zone=torii_api_limit:10m rate=30r/s;
#     limit_req_status 429;
#
# The zone name `torii_api_limit` is deliberately specific so it will not
# collide with an existing global zone (e.g. a generic `one`/`api`). If you
# already declare your own zone, either reuse its name below or keep ours —
# do NOT redeclare a zone that already exists (nginx -t will reject a
# duplicate). The installer refuses to write the fragment if a zone of the
# same name is already defined anywhere under /etc/nginx.

location /api/ {
    # No trailing slash + no URI on proxy_pass keeps the full /api/... path,
    # so the agent sees the same paths it serves at the root on your gateway.
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    # Edge burst shedding. 30r/s with a burst of 60 (nodelay) is far above any
    # human sign-in cadence but caps a scripted flood. The in-process limiter
    # remains the source of truth for per-route auth limits + Retry-After.
    limit_req zone=torii_api_limit burst=60 nodelay;

    # Client IP semantics: nginx is the ONLY hop in front of the agent and it
    # runs on the same host, so $remote_addr is the real client. We pass it as
    # X-Real-IP and append to X-Forwarded-For; the agent trusts this single
    # local proxy for req.ip (its rate-limit bucket key). Do not add another
    # proxy in front without revisiting the agent's trust-proxy assumption.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Chat + memory endpoints can be slow (Routstr round-trip, decrypt).
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # Matches the agent's 512 KB bodyLimit with a little headroom.
    client_max_body_size 1m;
}

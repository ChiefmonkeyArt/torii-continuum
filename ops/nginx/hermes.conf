# Hermes Web Dashboard (owner brain) — admin-gated same-origin mount
#
# Installed to /etc/nginx/snippets/hermes.conf and included INSIDE the same
# `server { ... }` HTTPS block that serves the Continuum console at
# /continuum/ (the torii-base gateway). Do NOT include at http{} or top level.
#
#   server {
#       server_name chiefmonkey.art;
#       # ... TLS, root, the continuum fragment, other locations ...
#       include snippets/hermes.conf;
#   }
#
# The dashboard binds 127.0.0.1:9119 (loopback => Hermes's own auth gate is
# OFF). The ONLY route to it is through this block, and only a valid Continuum
# admin session passes.
#
# WHY SAME-ORIGIN /hermes/ (not a subdomain): the session cookie is
# `__Host-torii_session`. A `__Host-` cookie is host-locked — it is sent only
# to the exact origin that set it and never to a subdomain. A
# `hermes.chiefmonkey.art` server block would receive NO cookie, so
# auth_request would always 401. The dashboard must live on the same origin as
# the Continuum console.

location /hermes/ {
    # Require a valid Continuum admin session before proxying anything.
    auth_request /torii-hermes-auth;

    # Trailing slash on proxy_pass strips the /hermes/ prefix, so the dashboard
    # sees the same URI paths it serves when bound directly.
    proxy_pass http://127.0.0.1:9119/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Tell the dashboard it is mounted under a prefix, so it can rebuild
    # absolute asset/API URLs. VERIFY the installed Hermes build honours this
    # (or exposes its own base-url flag) — see ops/hermes-dashboard.md.
    proxy_set_header X-Forwarded-Prefix /hermes;

    # The Chat tab drives the embedded TUI over a WebSocket (/api/pty).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    client_max_body_size  1m;
}

# Internal auth_request target: forward the session cookie to Continuum's
# read-only GET /api/auth/session (loopback, direct — independent of the public
# mount path). 200 => allow; 401 => the error_page below.
location = /torii-hermes-auth {
    internal;
    proxy_pass http://127.0.0.1:8787/api/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # auth_request subrequests do not inherit the client Cookie automatically;
    # forward it explicitly or every request fails closed.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# No admin session => send them to the Continuum console to sign in.
# Adjust `/continuum/` to `/` for a standalone (non-torii-base) install.
error_page 401 = @torii_hermes_login;
location @torii_hermes_login {
    return 302 $scheme://$host/continuum/;
}
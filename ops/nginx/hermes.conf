# Hermes Web Dashboard — same-origin /hermes/ path mount (loopback, passwordless)
#
# Hermes binds 127.0.0.1:9119 with NO dashboard.public_url and NO basic_auth, so
# it runs in unauthenticated loopback mode (no login). The ONLY route in is this
# block, gated on a valid Continuum Nostr session via auth_request. Live at
# https://<continuum-apex>/hermes/ — no subdomain, no password, no SSH.
#
# INSTALL: drop this as ONE server-context fragment inside the SAME `server {}`
# block that serves the Continuum console on the apex (the torii-base gateway
# includes every file in /opt/torii/nginx-fragments/). It is NOT a standalone
# vhost. Do NOT split the locations or the error_page/`@` block into a
# different server.
#
# WHY SAME-ORIGIN: the session cookie is `__Host-torii_session` (host-locked to
# the exact apex origin). A subdomain would receive no cookie, so auth_request
# would always 401. Hermes must live on the same origin as the Continuum console.
#
# WHY NO PASSWORD: Hermes deems a non-loopback `dashboard.public_url` as the
# trigger to require an auth provider (password/OAuth). With no public_url it is
# passwordless. Continuum's Nostr session is the only authority. See
# docs/hermes-dashboard-auth.md.

location = /hermes { return 301 /hermes/; }

location /hermes/ {
    # Gate on a valid Continuum (Nostr) session before proxying anything.
    auth_request /torii-hermes-auth;

    # Trailing slash on proxy_pass strips /hermes/, so Hermes sees root paths;
    # X-Forwarded-Prefix makes it mount-aware (rewrites asset URLs / base path).
    proxy_pass http://127.0.0.1:9119/;
    proxy_http_version 1.1;

    # Loopback-unauth mode accepts ONLY a loopback Host and a direct (not
    # X-Forwarded-For) peer. Send a loopback Host and DO NOT forward X-Real-IP /
    # X-Forwarded-For, so both the HTTP host check and the WS peer check pass.
    proxy_set_header Host 127.0.0.1:9119;
    proxy_set_header X-Forwarded-Prefix /hermes;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Strip Origin so Hermes's loopback WS host/origin gate AND its CORS regex
    # (localhost/127.0.0.1 only) both pass — a cross-origin apex Origin is
    # rejected in loopback mode.
    proxy_set_header Origin "";

    # Chat tab drives an embedded WebSocket; forward the upgrade and keep it
    # alive. The SPA authenticates the socket with ?token=<session token> (the
    # pinned HERMES_DASHBOARD_SESSION_TOKEN, which MUST be URL-safe/hex).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 5s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    client_max_body_size  1m;
}

# Internal auth_request target: forward the session cookie to Continuum's
# read-only GET /api/auth/session (loopback, direct — port 8787 is the
# torii-continuum Fastify agent). 200 => allow; 401 => the error_page below.
location = /torii-hermes-auth {
    internal;
    proxy_pass http://127.0.0.1:8787/api/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # auth_request subrequests do not inherit the client Cookie automatically;
    # forward it explicitly or every request fails closed.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# No session => send them to sign in with their Nostr signer in Continuum.
error_page 401 = @torii_hermes_login;
location @torii_hermes_login {
    return 302 $scheme://$host/continuum/;
}

# Hermes runtime chunks.
#
# Hermes's SPA is built with base "/", so its lazy-loaded route chunks (Chat,
# System, Sessions, Docs, …) are requested at RUNTIME as root-relative
# /assets/<name>-<hash>.js|.css|.woff2 URLs generated by the bundler — NOT under
# /hermes/. mount_spa's X-Forwarded-Prefix rewrite fixes only the static
# index.html refs and the __HERMES_BASE_PATH__ used for /api/* (not the bundler's
# chunk loader), so those chunk requests land on the launcher's /assets/ tree and
# 404 => clicking Chat/System renders a blank screen.
#
# This regex location (evaluated before the launcher's /assets/ prefix block in
# torii.conf) forwards /assets/*.{js,css,woff2} to Hermes on loopback — Hermes
# reads its own web_dist (which nginx cannot, since it lives under the 0700
# hermes-owner home) — and falls back to the launcher's own fixed-name files
# (launcher.js, create.css, …) when Hermes answers 404. File sets are disjoint:
# Hermes chunks are content-hashed (ChatPage-<hash>.js, …), launcher assets are
# fixed names, and .mjs is still handled by torii.conf's own /assets/*.mjs regex.
#
# These static chunks carry no secrets (the session token is injected only into
# the gated index.html), so no auth_request here; the /hermes/ index and every
# /api/ call remain Nostr-session-gated.
location ~ ^/assets/.+\.(js|css|woff2)$ {
    # No URI on proxy_pass (regex location + full-URI passthrough); Hermes serves
    # /assets/* from its web_dist, 404s anything it doesn't own.
    proxy_pass http://127.0.0.1:9119;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9119;
    proxy_set_header Origin "";
    proxy_intercept_errors on;
    error_page 404 = @torii_launcher_assets;
    access_log off;
    expires 1h;
}

# Fallback for /assets/*.{js,css,woff2} Hermes doesn't own: serve the launcher's
# own files (launcher.js, create.js, *.css) from its tree untouched.
location @torii_launcher_assets {
    root /opt/torii/launcher;
    try_files $uri =404;
    access_log off;
    expires 1h;
}
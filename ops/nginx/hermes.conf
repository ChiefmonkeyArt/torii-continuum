# Hermes Web Dashboard — standalone subdomain vhost (owner brain)
#
# A dedicated vhost for Nous Research's Hermes Web Dashboard, served at the
# ROOT of a subdomain (e.g. hermes.chiefmonkey.art) and gated by Hermes's OWN
# password auth. Installed to /etc/nginx/sites-available/ and enabled with a
# symlink into sites-enabled/. Replace __HERMES_DASHBOARD_HOST__ with the FQDN
# at install time.
#
# WHY A SUBDOMAIN, NOT A /hermes/ PATH MOUNT:
#   Hermes's web SPA (v0.21.x) is built to serve from `/`. Its login form posts
#   to `/auth/password-login` and it lazy-loads chunks from `/assets/` — both
#   ROOT-relative URLs that IGNORE the `X-Forwarded-Prefix` header and the
#   `dashboard.public_url` path. Mounting it under `/hermes/` therefore 404s on
#   login and breaks the Chat tab's lazy chunks. A root mount (subdomain) is the
#   only clean form. See docs/hermes-dashboard-auth.md.
#
# WHY HERMES'S OWN AUTH (not nginx auth_request):
#   As of Hermes's June-2026 hardening, ANY non-loopback exposure of the
#   dashboard requires a configured auth provider (password or OAuth) — there is
#   no unauth public-dashboard mode. The `__Host-torii_session` Continuum cookie
#   is host-locked to the apex origin, so it is never sent to a subdomain and
#   `auth_request` against it would always 401. The dashboard's own
#   basic_auth (form login, ~30-day session) is therefore the gate here.
#
# SECURITY BOUNDARY: Hermes still binds 127.0.0.1:9119 (loopback). This vhost is
# a plain reverse proxy — it forwards, it does not authenticate. The loopback
# bind is what keeps the dashboard off the public internet; Hermes's own auth is
# the door.

server {
    listen 80;
    listen [::]:80;
    server_name __HERMES_DASHBOARD_HOST__;

    # HTTP-01 challenge for certbot. The vhost is created BEFORE the cert, so
    # this location is what lets Let's Encrypt reach the box on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HERMES_DASHBOARD_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HERMES_DASHBOARD_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HERMES_DASHBOARD_HOST__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        # Root mount: NO trailing slash on proxy_pass, so the full URI path is
        # forwarded unchanged (the SPA expects to be at /).
        proxy_pass         http://127.0.0.1:9119;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Chat tab drives the embedded TUI over a WebSocket (/api/pty) and a
        # per-channel event stream (/api/events). Both need the upgrade.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}
---
# Role: continuum — installs the Continuum SPA + agent under /home/{{ continuum_user }}/.
#
# SAFETY MODEL (v0.2.40/41/42-alpha hardening)
# --------------------------------------------
# The agent's funded Routstr key + character ciphertexts are encrypted at rest
# with a key DERIVED FROM session_secret. Overwriting config.yaml with a fresh
# session_secret, or pointing the service at an empty state dir, ORPHANS that key
# irrecoverably. So this role:
#
#   1. Detects which layout already exists (existing-ansible | partial-adoption |
#      adopt-standalone | fresh) via ops/lib/continuum-adopt.sh.
#   2. Backs up config + encrypted state to a timestamped root-only 0700 dir
#      BEFORE any mutation. Fail-closed: no backup, no deploy.
#   3. Builds the git checkout + npm + vite build in a CLEAN staging/release dir
#      that NEVER holds authoritative state, with the OLD service still running.
#   4. Renders config.yaml ONLY on a fresh install, or when the operator has
#      explicitly set continuum_allow_config_rotation=true.
#   5. Stops the old unit only immediately before the final state copy + atomic
#      cutover, copies authoritative state VERBATIM into the staged release, then
#      atomically swaps the release into place — quarantining (never deleting)
#      any pre-existing app dir.
#   6. Wraps the cutover in block/rescue: on failure it stops the new unit,
#      restores the previous layout (re-enables the standalone unit, or rolls the
#      quarantined Ansible tree back), and surfaces the backup + quarantine paths
#      plus an exact recovery command — no secret printed.
#
# WHY v0.2.42 EXISTS
# ------------------
# The v0.2.41 role migrated live state INTO /home/<user>/app/agent and only THEN
# ran `git clone` into /home/<user>/app — cloning into a directory already
# populated with runtime state. On the live box that failed, leaving the original
# standalone layout intact AND a partial, non-git /home/<user>/app holding a COPY
# of the state. v0.2.42 fixes the ordering (build in staging first, copy + swap
# last) and adds explicit partial-adoption detection + recovery, so re-running
# after that exact failure is idempotent and completes cleanly.
#
# Layout on disk (Ansible, after a successful cutover):
#   /home/continuum/app/                <- promoted git checkout of torii-continuum
#                        dist/          <- vite build output (served by nginx)
#                        agent/
#                          config.yaml  <- preserved/migrated (chmod 600)
#                          memory/      <- wallet + costs + audit + panic state
#                          ciphertexts/ <- encrypted funded key + character
#                          pending/     <- draft events awaiting signature

- name: Resolve paths + backup/cutover timestamp
  ansible.builtin.set_fact:
    continuum_stamp: "{{ ansible_date_time.iso8601_basic_short | default(lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ')) }}"
    continuum_app_dir: "/home/{{ continuum_user }}/app"
    continuum_agent_dir: "/home/{{ continuum_user }}/app/agent"
    continuum_release_agent_dir: "{{ continuum_release_dir }}/agent"
    continuum_adopt_lib: "{{ playbook_dir }}/../lib/continuum-adopt.sh"

- name: Resolve backup dir (uses the run timestamp)
  ansible.builtin.set_fact:
    continuum_backup_dir: "{{ continuum_backup_root }}/continuum-backup-{{ continuum_stamp }}"

- name: Ensure continuum OS user exists
  ansible.builtin.user:
    name: "{{ continuum_user }}"
    system: true
    shell: /bin/bash
    home: "/home/{{ continuum_user }}"
    create_home: true

# ── 1. Detect layout (app_dir .git presence disambiguates partial adoption) ──
- name: Detect existing install layout
  ansible.builtin.script: >-
    {{ continuum_adopt_lib }} detect
    {{ continuum_app_dir | quote }}
    {{ continuum_agent_dir | quote }}
    {{ continuum_standalone_dir | quote }}
  register: continuum_detect
  changed_when: false

- name: Record detected mode
  ansible.builtin.set_fact:
    continuum_mode: "{{ continuum_detect.stdout | regex_search('mode=([a-z-]+)', '\\1') | first }}"

- name: Show detected mode
  ansible.builtin.debug:
    msg: "Continuum install mode: {{ continuum_mode }}"

- name: Resolve the authoritative live state dir for this mode
  ansible.builtin.script: >-
    {{ continuum_adopt_lib }} authoritative
    {{ continuum_mode | quote }}
    {{ continuum_agent_dir | quote }}
    {{ continuum_standalone_dir | quote }}
  register: continuum_auth
  changed_when: false

- name: Record authoritative state dir
  ansible.builtin.set_fact:
    continuum_authoritative_dir: "{{ continuum_auth.stdout | trim }}"

# The unit that currently owns port {{ continuum_agent_port }} and must be stopped
# at cutover: the standalone unit for adopt/partial modes, the Ansible unit for an
# in-place update, none on a fresh install.
- name: Record the unit to stop at cutover
  ansible.builtin.set_fact:
    continuum_old_service: >-
      {{ continuum_standalone_service
         if continuum_mode in ['adopt-standalone', 'partial-adoption']
         else (continuum_service if continuum_mode == 'existing-ansible' else '') }}

# ── 2. Back up ALL state before any mutation (fail-closed) ───────────────────
# Sources: the standalone dir AND the Ansible agent dir (a partial adoption has
# state in both). backup_state creates the 0700 backup dir and copies config.yaml
# + memory/ + ciphertexts/ + pending/. A non-zero return aborts the whole run.
- name: Back up config + encrypted state before mutating (fail-closed)
  ansible.builtin.script: >-
    {{ continuum_adopt_lib }} backup
    {{ continuum_backup_dir | quote }}
    {{ continuum_standalone_dir | quote }}
    {{ continuum_agent_dir | quote }}
  register: continuum_backup
  changed_when: "'items=' in continuum_backup.stdout"
  failed_when: continuum_backup.rc != 0
  no_log: true

- name: Report backup location (no secret values)
  ansible.builtin.debug:
    msg: "State backup written to {{ continuum_backup_dir }} (root-only 0700). Recovery: cp -a {{ continuum_backup_dir }}/<label>/* into the agent dir and restart {{ continuum_service }}."

# ── 3. Config decision — render ONLY on fresh install or explicit rotation ────
- name: Decide config.yaml action
  ansible.builtin.script: >-
    {{ continuum_adopt_lib }} config-action
    {{ continuum_mode | quote }}
    {{ continuum_allow_config_rotation | string | lower | quote }}
  register: continuum_cfg_action
  changed_when: false

- name: Record config action
  ansible.builtin.set_fact:
    continuum_config_action: "{{ continuum_cfg_action.stdout | trim }}"

# Vault-backed config vars present in scope? Evaluated with the default filter so
# an UNDEFINED var never raises — a missing vault.yml simply yields false.
- name: Determine whether vault-backed config vars are present
  ansible.builtin.set_fact:
    continuum_vault_vars_present: >-
      {{ (admin_npub | default('') | string | length > 0)
         and (session_secret | default('') | string | length > 0) }}

# Fail CLOSED before touching anything when a render/rotate is required but the
# vault vars are absent. No secret is printed and no state has been mutated.
- name: Fail closed when config render/rotation is required but vault vars are absent
  ansible.builtin.fail:
    msg: >-
      Continuum '{{ continuum_config_action }}' requires the config vars
      admin_npub and session_secret to be defined (normally via an
      ansible-vault group_vars/vault.yml loaded with --ask-vault-pass). They are
      NOT defined, so the deploy is stopping BEFORE building or mutating any
      state. No secret value was read or printed. A FRESH install must supply
      these vars; an explicit rotation (continuum_allow_config_rotation=true)
      must also supply them. Adopting or redeploying an EXISTING install does not
      need them — the live config.yaml is preserved byte-for-byte.
  when:
    - continuum_config_action in ['render', 'rotate']
    - not (continuum_vault_vars_present | bool)

# ── 4. PREFLIGHT — build into a CLEAN staging dir; OLD service stays running ──
# Nothing here touches the live layout or the running unit. A clone/npm/build
# failure leaves the original standalone (or Ansible) install serving traffic.
- name: Reset the staging/release dir (clean slate — never holds live state)
  ansible.builtin.script: >-
    {{ continuum_adopt_lib }} stage-reset {{ continuum_release_dir | quote }}
  register: continuum_stage_reset
  changed_when: "'ok' in continuum_stage_reset.stdout"

- name: Own the staging dir as the continuum user
  ansible.builtin.file:
    path: "{{ continuum_release_dir }}"
    state: directory
    owner: "{{ continuum_user }}"
    group: "{{ continuum_user }}"
    mode: '0750'

- name: Clone (or check out) torii-continuum INTO STAGING
  ansible.builtin.git:
    repo: "{{ continuum_repo }}"
    dest: "{{ continuum_release_dir }}"
    version: "{{ continuum_version }}"
    force: true
    depth: 1
  become_user: "{{ continuum_user }}"
  register: continuum_git

- name: Install npm dependencies in staging (dev + prod, needed for vite build)
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ continuum_release_dir }}"
  become_user: "{{ continuum_user }}"
  environment:
    NODE_ENV: development
  register: npm_install
  changed_when: npm_install.rc == 0

- name: Build Continuum SPA in staging (base-path aware)
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ continuum_release_dir }}"
  become_user: "{{ continuum_user }}"
  environment:
    NODE_ENV: production
    VITE_AGENT_URL: "{{ continuum_vite_agent_url }}"
  register: continuum_build
  changed_when: continuum_build.rc == 0

- name: Install agent production dependencies in staging
  ansible.builtin.command:
    cmd: npm ci --omit=dev
    chdir: "{{ continuum_release_agent_dir }}"
  become_user: "{{ continuum_user }}"
  args:
    creates: "{{ continuum_release_agent_dir }}/node_modules"

# Optional (guarded) drift diagnostic: when the vault vars ARE present, render a
# candidate config to a ROOT-ONLY temp path (never into staging/app) and compare
# its session_secret against the authoritative live config, so the operator learns
# a rotation is pending. Skipped entirely without vault vars — no undefined-var
# evaluation, no candidate on disk.
- name: Render candidate config to a root-only temp path for drift check
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ continuum_backup_dir }}/.config.candidate.yaml"
    owner: root
    group: root
    mode: '0600'
  when:
    - continuum_config_action == 'preserve'
    - continuum_vault_vars_present | bool
    - continuum_authoritative_dir | length > 0
  no_log: true

- name: Compare authoritative live config vs vault candidate (reveals no value)
  ansible.builtin.script: >-
    {{ continuum_adopt_lib }} config-drift
    {{ continuum_authoritative_dir | quote }}/config.yaml
    {{ continuum_backup_dir | quote }}/.config.candidate.yaml
  register: continuum_drift
  changed_when: false
  when:
    - continuum_config_action == 'preserve'
    - continuum_vault_vars_present | bool
    - continuum_authoritative_dir | length > 0
  no_log: true

- name: Remove the candidate config (never left on disk)
  ansible.builtin.file:
    path: "{{ continuum_backup_dir }}/.config.candidate.yaml"
    state: absent
  when:
    - continuum_config_action == 'preserve'
    - continuum_vault_vars_present | bool

- name: Warn if vault differs from the preserved config (no secret printed)
  ansible.builtin.debug:
    msg: >-
      NOTICE: existing config.yaml will be PRESERVED. The vault session_secret
      DIFFERS from the live one. This deploy will NOT rotate it (rotating would
      orphan the funded key). To rotate deliberately: re-run with
      -e continuum_allow_config_rotation=true (backup at {{ continuum_backup_dir }}).
  when:
    - continuum_config_action == 'preserve'
    - continuum_vault_vars_present | bool
    - continuum_drift.stdout is defined
    - "'differ' in continuum_drift.stdout"

- name: Note that drift diagnostics are skipped without vault vars (no secret)
  ansible.builtin.debug:
    msg: >-
      Existing config.yaml will be PRESERVED byte-for-byte. Vault config vars are
      not in scope, so the drift diagnostic was skipped (expected for a vault-free
      adoption or redeploy). Backup at {{ continuum_backup_dir }} (root-only 0700).
  when:
    - continuum_config_action == 'preserve'
    - not (continuum_vault_vars_present | bool)

# ── 5. TRANSACTIONAL CUTOVER — stop old, copy state, atomic swap, start new ──
- name: Cut over service + nginx (transactional)
  block:
    # 5a. Free the port: stop the currently-serving unit. Disable the standalone
    #     unit on adopt/partial so it never races the new unit on boot.
    - name: Stop the old unit to free port {{ continuum_agent_port }}
      ansible.builtin.systemd:
        name: "{{ continuum_old_service }}"
        state: stopped
      when: continuum_old_service | length > 0
      failed_when: false

    - name: Disable the standalone unit on adopt/partial (prevents boot races)
      ansible.builtin.systemd:
        name: "{{ continuum_standalone_service }}"
        enabled: false
      when: continuum_mode in ['adopt-standalone', 'partial-adoption']
      failed_when: false

    # 5b. Render config into the STAGED agent (fresh/rotation only). On preserve
    #     nothing is rendered — the authoritative config is copied verbatim next.
    - name: Render agent config.yaml into staging (fresh install or explicit rotation)
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ continuum_release_agent_dir }}/config.yaml"
        owner: "{{ continuum_user }}"
        group: "{{ continuum_user }}"
        mode: '0600'
      when: continuum_config_action in ['render', 'rotate']
      no_log: true

    # 5c. Copy authoritative live state VERBATIM into the staged release. config
    #     is copied only if not already present (rotation renders it first);
    #     memory/ciphertexts/pending are always carried over. session_secret and
    #     the funded key are copied byte-for-byte, never regenerated.
    - name: Copy authoritative config + encrypted state into the staged release
      ansible.builtin.script: >-
        {{ continuum_adopt_lib }} migrate
        {{ continuum_authoritative_dir | quote }}
        {{ continuum_release_agent_dir | quote }}
        {{ continuum_user | quote }}
      register: continuum_migrate
      changed_when: "'copied' in continuum_migrate.stdout"
      failed_when: continuum_migrate.rc != 0
      when: continuum_authoritative_dir | length > 0
      no_log: true

    - name: Ensure agent runtime dirs exist in the staged release
      ansible.builtin.file:
        path: "{{ continuum_release_agent_dir }}/{{ item }}"
        state: directory
        owner: "{{ continuum_user }}"
        group: "{{ continuum_user }}"
        mode: '0700'
      loop:
        - memory
        - memory/wallet
        - pending
        - ciphertexts

    # 5d. Atomic swap: quarantine any pre-existing app dir (never delete it), then
    #     move staging into place. Same-filesystem renames.
    - name: Atomically promote the staged release into {{ continuum_app_dir }}
      ansible.builtin.script: >-
        {{ continuum_adopt_lib }} promote
        {{ continuum_release_dir | quote }}
        {{ continuum_app_dir | quote }}
        {{ continuum_quarantine_dir | quote }}
      register: continuum_promote
      changed_when: "'promoted' in continuum_promote.stdout"
      failed_when: continuum_promote.rc != 0

    - name: Mark the release as promoted (enables rescue rollback if a later step fails)
      ansible.builtin.set_fact:
        continuum_swapped: true

    - name: Lock ownership of the promoted app tree
      ansible.builtin.command:
        cmd: "chown -R {{ continuum_user }}:{{ continuum_user }} {{ continuum_app_dir }}"
      changed_when: true

    - name: Install continuum-agent systemd unit
      ansible.builtin.template:
        src: continuum-agent.service.j2
        dest: /etc/systemd/system/continuum-agent.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart continuum-agent

    - name: Enable and start continuum-agent
      ansible.builtin.systemd:
        name: continuum-agent
        enabled: true
        state: started
        daemon_reload: true

    - name: Render nginx fragment for /continuum
      ansible.builtin.template:
        src: continuum.nginx.conf.j2
        dest: "/opt/torii/nginx-fragments/continuum.conf"
        owner: root
        group: root
        mode: '0644'
      notify: reload nginx

    - name: Register /continuum with torii launcher
      ansible.builtin.shell: |
        set -eo pipefail
        source /opt/torii/env
        /usr/local/bin/torii register continuum "Continuum" "{{ continuum_mount_path }}" "App builder + agent"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Set launcher root_app if requested
      ansible.builtin.shell: |
        set -eo pipefail
        source /opt/torii/env
        /usr/local/bin/torii set-root {{ torii_root_app | quote }}
      args:
        executable: /bin/bash
      when: torii_root_app is defined
      changed_when: true

    - name: Wait for agent to answer /api/health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ continuum_agent_port }}/api/health"
        status_code: 200
      register: agent_health
      retries: 15
      delay: 2
      until: agent_health.status == 200

  rescue:
    # Stop the half-started new unit so it never fights the restored one.
    - name: Stop the new continuum-agent after a failed cutover
      ansible.builtin.systemd:
        name: continuum-agent
        state: stopped
        enabled: false
      failed_when: false

    # If we already swapped an EXISTING Ansible tree, roll it back from quarantine.
    - name: Roll the previous Ansible tree back from quarantine
      ansible.builtin.script: >-
        {{ continuum_adopt_lib }} rollback
        {{ continuum_app_dir | quote }}
        {{ continuum_quarantine_dir | quote }}
        {{ continuum_failed_release_dir | quote }}
      when:
        - continuum_swapped | default(false) | bool
        - continuum_mode == 'existing-ansible'
      failed_when: false

    - name: Restart the restored Ansible unit
      ansible.builtin.systemd:
        name: "{{ continuum_service }}"
        state: started
      when:
        - continuum_swapped | default(false) | bool
        - continuum_mode == 'existing-ansible'
      failed_when: false

    # For adopt/partial modes the original standalone install is untouched on disk
    # (we only stopped/disabled its unit) — re-enable and start it to restore service.
    - name: Re-enable and start the original standalone unit
      ansible.builtin.systemd:
        name: "{{ continuum_standalone_service }}"
        enabled: true
        state: started
        daemon_reload: true
      when: continuum_mode in ['adopt-standalone', 'partial-adoption']
      failed_when: false

    - name: Surface backup + quarantine paths and recovery command on cutover failure
      ansible.builtin.fail:
        msg: >-
          Continuum cutover FAILED. Your pre-deploy state is intact at
          {{ continuum_backup_dir }} (root-only 0700) and no secret was printed.
          The staged build (if any) is at {{ continuum_release_dir }}; a
          quarantined prior app tree (if the swap happened) is at
          {{ continuum_quarantine_dir }}.
          RECOVERY (adopt/partial): the original standalone install was left on
          disk and its unit re-enabled — verify with
          `systemctl status {{ continuum_standalone_service }}` and
          `curl -sf http://127.0.0.1:{{ continuum_agent_port }}/api/health`.
          RECOVERY (existing-ansible): the previous tree was rolled back from
          {{ continuum_quarantine_dir }} and {{ continuum_service }} restarted;
          if needed restore state with
          `cp -a {{ continuum_backup_dir }}/<label>/{config.yaml,memory,ciphertexts,pending} {{ continuum_agent_dir }}/`
          then `systemctl restart {{ continuum_service }}`.

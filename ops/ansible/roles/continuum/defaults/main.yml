---
# Role: continuum — default variables for standalone→Ansible adoption.
#
# These are SAFE, non-secret defaults. The values below govern the adoption +
# backup + config-preservation behaviour and rarely need overriding.
#
# OPS-CUTOVER-3 (v0.2.60-alpha): the structural identity vars below
# (continuum_user, continuum_repo, continuum_agent_host/port, mount_path,
# vite_agent_url) were previously supplied ONLY via a hand-copied
# group_vars/all.yml (from all.yml.example). group_vars/all.yml is gitignored
# and the unattended server-side pull (ops/deploy-unattended.sh) never created
# it, so a pristine tagged checkout failed at the first role task with
# `continuum_user is undefined`. They are now self-sufficient role defaults so a
# pristine checkout converges with NO group_vars/all.yml. They remain fully
# overridable (group_vars/all.yml or -e still win over defaults). Only the truly
# per-host, non-secret values (torii_domain, continuum_version) are passed
# explicitly by the wrapper via -e; secrets (admin_npub/session_secret) stay in
# the optional vault and are only consulted when a config is genuinely rendered.

# OS user the agent runs as, and where its app/state tree lives under /home.
# REQUIRED by the very first role task (path resolution + user creation); a
# missing value is the OPS-CUTOVER-3 root cause. Non-secret, safe to commit.
continuum_user: "continuum"

# Public HTTPS source for the app/agent checkout. Passed through to the git task;
# a pristine checkout with no group_vars/all.yml would otherwise fail here next.
continuum_repo: "https://github.com/ChiefmonkeyArt/torii-continuum.git"

# Where the agent listens (loopback only) and the mount path the SPA + nginx use.
# Consumed unconditionally by the nginx vhost template, the build env, and the
# health gate — so they must resolve even in unattended preserve mode.
continuum_agent_host: "127.0.0.1"
continuum_agent_port: 8787
continuum_mount_path: "/continuum"
continuum_vite_agent_url: "/continuum"

# Where a prior standalone install (ops/install-agent.sh) lives, and the unit it
# runs under. If this layout is detected and the Ansible layout is not yet
# populated, the role adopts it: stop/disable this unit, back up + migrate its
# state (config + encrypted key) into the Ansible layout VERBATIM.
continuum_standalone_dir: "/opt/torii/continuum-agent"
continuum_standalone_service: "torii-continuum-agent"

# The systemd unit the Ansible layout runs under.
continuum_service: "continuum-agent"

# Root-only directory under which timestamped pre-mutation backups are written.
# Each run creates <root>/continuum-backup-<UTC-timestamp>/ (mode 0700).
continuum_backup_root: "/root"

# HARD SAFETY GATE. When false (the default), the role will NEVER overwrite an
# existing config.yaml or change session_secret / admin_npub / cashu mints. It
# renders a fresh config ONLY on a genuinely fresh install. Set true ONLY when
# you deliberately intend to rotate an existing secret — doing so re-encrypts
# nothing and WILL orphan an already-funded Routstr key. Opt in per-run:
#   ansible-playbook ... -e continuum_allow_config_rotation=true
continuum_allow_config_rotation: false

# Transactional cutover (v0.2.42-alpha). The git checkout + npm + build happen in
# a CLEAN staging/release dir that never holds authoritative state; on success the
# release is atomically swapped into continuum_app_dir and any pre-existing app
# dir (including a partial, non-git tree from a failed adoption) is MOVED aside to
# a timestamped quarantine dir — never deleted. These paths sit next to the app
# dir so the swap is a same-filesystem rename. {{ continuum_stamp }} is a UTC
# timestamp the role computes once per run.
continuum_release_dir: "/home/{{ continuum_user }}/app.staging"
continuum_quarantine_dir: "/home/{{ continuum_user }}/app.quarantine-{{ continuum_stamp }}"
continuum_failed_release_dir: "/home/{{ continuum_user }}/app.failed-{{ continuum_stamp }}"

# Public static webroot (v0.2.43-alpha). nginx runs as www-data and CANNOT
# traverse /home/{{ continuum_user }} (0750 home + the unit's ProtectHome), so
# serving the SPA directly out of the private app dir returns HTTP 500. The
# built static bundle is instead deployed to a world-traversable public webroot
# owned by root (dirs 0755, files 0644); the app/agent source and the encrypted
# state stay PRIVATE under continuum_app_dir and are never exposed. The deploy is
# staged then atomically swapped, and the prior webroot is kept as a timestamped
# backup for rollback — never deleted in place.
continuum_webroot_parent: "/var/www/torii"
continuum_webroot: "/var/www/torii/continuum"
continuum_webroot_stage: "/var/www/torii/continuum.staging-{{ continuum_stamp }}"
continuum_webroot_backup: "/var/www/torii/continuum.backup-{{ continuum_stamp }}"

# Post-success disk retention (v0.2.75-alpha, extends OPS-RETENTION-1). After a
# verified-good cutover + health gate, the role runs the anchored disk-retention
# sweep (ops/torii-disk-retention.sh) to reclaim regenerable deploy artefacts that
# otherwise fill the small VPS disk: obsolete /opt/deploy/torii-continuum-<tag>/
# tooling clones, older /root/continuum-backup-<UTC>/ state backups, and any
# failed-clone app.staging residue. The sweep is fail-closed (it refuses to prune
# unless the live agent serves exactly the pinned tag) and anchored strictly to
# those globs; it can NEVER touch the live app tree, the pinned clone, the pin
# file, or config.yaml. Cleanup is best-effort: a prune failure never fails an
# already-successful deploy.
#
#   keep_sources — /opt/deploy/torii-continuum-* clones to keep. The CURRENT
#                  pinned clone is ALWAYS kept on top of this; default 1 keeps the
#                  pinned clone ONLY (a non-current tag is re-cloned on rollback).
#   keep_backups — newest /root/continuum-backup-* dirs to keep, by mtime.
#   quarantine_* — the cutover role parks the previous live tree as
#                  /home/continuum/app.quarantine-<UTC>/ (~617 MiB each) on every
#                  deploy; nothing pruned them centrally and nine (~5.5 GiB) filled
#                  /dev/sda1 and broke the v0.2.84-alpha deploy (2026-07-20). The
#                  sweep now keeps the newest `keep` regardless of age and prunes
#                  the rest only once older than `age_days`.
continuum_retention_enabled: true
continuum_retention_keep_sources: 1
continuum_retention_keep_backups: 3
continuum_retention_quarantine_parent: "/home/continuum"
continuum_retention_quarantine_age_days: 3
continuum_retention_quarantine_keep: 3

# Anchored roots the post-success sweep is allowed to prune, plus the pin file it
# reads (line-wise, never sourced) to resolve the current target tag. These MUST
# match ops/deploy-unattended.sh (CONTINUUM_DEPLOY_ROOT / CONTINUUM_CONF) so the
# playbook prunes exactly the tooling checkouts the deploy wrapper creates.
continuum_deploy_root: "/opt/deploy"
continuum_deploy_conf: "/etc/torii/continuum-deploy.conf"

# torii launcher registration (v0.2.43-alpha). The installed Torii CLI parses
# `torii register <name> [--display ...] [--desc ...] [--version ...]` with FLAGS,
# not positional args (the old positional form failed with `unknown flag`). The
# --version flag wants a bare semver, so the role strips the leading `v` from
# continuum_version at call time.
continuum_register_name: "continuum"
continuum_register_display: "Continuum"
continuum_register_desc: "App builder + agent"

---
# Role: continuum — default variables for standalone→Ansible adoption.
#
# These are SAFE, non-secret defaults. Domain/version/user come from
# group_vars/all.yml; the values below only govern the adoption + backup +
# config-preservation behaviour and rarely need overriding.

# Where a prior standalone install (ops/install-agent.sh) lives, and the unit it
# runs under. If this layout is detected and the Ansible layout is not yet
# populated, the role adopts it: stop/disable this unit, back up + migrate its
# state (config + encrypted key) into the Ansible layout VERBATIM.
continuum_standalone_dir: "/opt/torii/continuum-agent"
continuum_standalone_service: "torii-continuum-agent"

# The systemd unit the Ansible layout runs under.
continuum_service: "continuum-agent"

# Root-only directory under which timestamped pre-mutation backups are written.
# Each run creates <root>/continuum-backup-<UTC-timestamp>/ (mode 0700).
continuum_backup_root: "/root"

# HARD SAFETY GATE. When false (the default), the role will NEVER overwrite an
# existing config.yaml or change session_secret / admin_npub / cashu mints. It
# renders a fresh config ONLY on a genuinely fresh install. Set true ONLY when
# you deliberately intend to rotate an existing secret — doing so re-encrypts
# nothing and WILL orphan an already-funded Routstr key. Opt in per-run:
#   ansible-playbook ... -e continuum_allow_config_rotation=true
continuum_allow_config_rotation: false

# Transactional cutover (v0.2.42-alpha). The git checkout + npm + build happen in
# a CLEAN staging/release dir that never holds authoritative state; on success the
# release is atomically swapped into continuum_app_dir and any pre-existing app
# dir (including a partial, non-git tree from a failed adoption) is MOVED aside to
# a timestamped quarantine dir — never deleted. These paths sit next to the app
# dir so the swap is a same-filesystem rename. {{ continuum_stamp }} is a UTC
# timestamp the role computes once per run.
continuum_release_dir: "/home/{{ continuum_user }}/app.staging"
continuum_quarantine_dir: "/home/{{ continuum_user }}/app.quarantine-{{ continuum_stamp }}"
continuum_failed_release_dir: "/home/{{ continuum_user }}/app.failed-{{ continuum_stamp }}"

# Public static webroot (v0.2.43-alpha). nginx runs as www-data and CANNOT
# traverse /home/{{ continuum_user }} (0750 home + the unit's ProtectHome), so
# serving the SPA directly out of the private app dir returns HTTP 500. The
# built static bundle is instead deployed to a world-traversable public webroot
# owned by root (dirs 0755, files 0644); the app/agent source and the encrypted
# state stay PRIVATE under continuum_app_dir and are never exposed. The deploy is
# staged then atomically swapped, and the prior webroot is kept as a timestamped
# backup for rollback — never deleted in place.
continuum_webroot_parent: "/var/www/torii"
continuum_webroot: "/var/www/torii/continuum"
continuum_webroot_stage: "/var/www/torii/continuum.staging-{{ continuum_stamp }}"
continuum_webroot_backup: "/var/www/torii/continuum.backup-{{ continuum_stamp }}"

# torii launcher registration (v0.2.43-alpha). The installed Torii CLI parses
# `torii register <name> [--display ...] [--desc ...] [--version ...]` with FLAGS,
# not positional args (the old positional form failed with `unknown flag`). The
# --version flag wants a bare semver, so the role strips the leading `v` from
# continuum_version at call time.
continuum_register_name: "continuum"
continuum_register_display: "Continuum"
continuum_register_desc: "App builder + agent"
